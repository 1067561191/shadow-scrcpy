name: Build

on:
  push:
    tags:
      - 'v*'

env:
  VERSION: ${{ github.ref_name }}

permissions:
  contents: write

jobs:
  build-scrcpy-server:
    runs-on: ubuntu-latest
    env:
      GRADLE: gradle
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build
        run: release/build_server.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: scrcpy-server
          path: release/work/build-server/server/scrcpy-server

  build-win64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y meson ninja-build nasm \
             mingw-w64 mingw-w64-tools libz-mingw-w64-dev

      - name: Build
        run: release/build_windows.sh 64

      - name: Tar
        run: |
            cd release/work/build-win64
            mkdir dist-tar
            cd dist-tar
            tar -C .. -cvf dist.tar.gz dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-win64-intermediate
          path: release/work/build-win64/dist-tar/

  package-win64:
    needs:
      - build-scrcpy-server
      - build-win64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download scrcpy-server
        uses: actions/download-artifact@v8
        with:
          name: scrcpy-server
          path: release/work/build-server/server/

      - name: Download build-win64
        uses: actions/download-artifact@v8
        with:
          name: build-win64-intermediate
          path: release/work/build-win64/dist-tar/

      - name: Detar
        run: |
            cd release/work/build-win64
            tar xf dist-tar/dist.tar.gz

      - name: Package
        run: release/package_client.sh win64 zip

      - name: Upload release
        uses: actions/upload-artifact@v7
        with:
          name: release-win64
          path: release/output

  release:
    needs:
      - build-scrcpy-server
      - package-win64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download scrcpy-server
        uses: actions/download-artifact@v8
        with:
          name: scrcpy-server
          path: release/work/build-server/server/

      - name: Download release-win64
        uses: actions/download-artifact@v8
        with:
          name: release-win64
          path: release/output/

      - name: Package server
        run: release/package_server.sh

      - name: Generate checksums
        run: release/generate_checksums.sh

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: scrcpy-release-${{ env.VERSION }}
          path: release/output

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: scrcpy ${{ env.VERSION }}
          draft: false
          prerelease: ${{ contains(env.VERSION, '-') }}
          files: |
            release/output/*
          generate_release_notes: true
